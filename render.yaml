services:
  - type: web
    name: attendance-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: CAMERA_AVAILABLE
        value: true
      - key: CAMERA_URL
        value: rtsp://admin:password@YOUR_CAMERA_IP:554/stream
      - key: PYTHON_VERSION
        value: 3.11.0
