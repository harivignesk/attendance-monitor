<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Face Recognition Attendance System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
      <span>AI Face Attendance</span>
    </div>
    <ul class="nav-links">
      <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">📷 Live Scanner</a></li>
      <li><a href="/register" class="{% if request.path == '/register' %}active{% endif %}">👤 Register Student</a></li>
      <li><a href="/reports" class="{% if request.path == '/reports' %}active{% endif %}">📊 Reports & Export</a></li>
    </ul>
  </nav>

  <!-- Main Content Container -->
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer>
    <p>AI Face Recognition Attendance Machine &copy; 2026. Powered by OpenCV, SQLite & Flask.</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
